<div class="mx-auto max-w-4xl p-8">
  <p class="text-sm uppercase tracking-wide text-capella-400">
    {{ 'units.unit-2.title' | translate }}
  </p>
  <h1 class="m-0 mt-1 text-3xl font-medium">{{ 'chapters.functional-keys' | translate }}</h1>

  <p class="mt-6 text-gray-50">
    {{ 'chapterIntro.functional-keys' | translate }}
  </p>

  <div class="mt-8 grid grid-cols-1 gap-4 sm:grid-cols-2">
    @for (exercise of exercises; track exercise.id) {
      <app-exercise-card
        [exercise]="exercise"
      />
    }
  </div>

  <app-chapter-nav chapterId="functional-keys" />
</div>
