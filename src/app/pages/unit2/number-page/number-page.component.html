<div class="mx-auto max-w-4xl p-8">
  <p class="text-sm uppercase tracking-wide text-capella-400">
    Unit 2: Standard Keys
  </p>
  <h1 class="m-0 mt-1 text-3xl font-medium">Chapter 2: Number</h1>

  <p class="mt-6 text-gray-50">
    Digits usually live one layer up from letters, so most of them ask for
    a layer-shift switch held alongside the digit switch itself.
  </p>

  <div class="mt-8 grid grid-cols-1 gap-4 sm:grid-cols-2">
    @for (exercise of exercises; track exercise.id) {
      <app-exercise-card
        [exercise]="exercise"
      />
    }
  </div>

  <app-chapter-nav chapterId="number" />
</div>
